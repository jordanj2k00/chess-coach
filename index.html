<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Trainer</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <h2>♟️ Chess Trainer</h2>

        <select id="gameMode" onchange="changeMode()">
            <option value="computer">Vs Computer</option>
            <option value="training">Training</option>
            <option value="theory">Theory</option>
            <option value="analysis">Analysis</option>
        </select>

        <div class="buttons">
            <button onclick="resetGame()">Reset</button>
            <button onclick="flipBoard()">Flip</button>
            <button onclick="showBestMove()">Best Move</button>
            <button onclick="resignGame()">Resign</button>
        </div>

        <div id="status" class="box"></div>
        <div id="openingDisplay" class="box gold"></div>
        <div id="coach" class="box"></div>
        <div id="adaptiveCoach" class="box"></div>
        <div id="positionPlan" class="box"></div>
        <div id="history" class="box history"></div>
    </div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <div class="eval-bar">
        <div id="evalFill"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
